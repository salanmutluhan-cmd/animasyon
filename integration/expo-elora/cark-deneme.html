<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Elora Döngü Çarkı</title>
<style>
:root{--bg:#FFF4F7;--card:#FFFFFF;--ink:#4A2235;--muted:#9B7480;--rose:#F0648C;--lav:#A98BE6;--gold:#F5B83D;--border:#F6DCE3;--disc:#FFF8FA;--track:#F8E3EA}
:root[data-theme="dark"]{--bg:#1B1026;--card:#2A1A3A;--ink:#F6EAF4;--muted:#BBA3C6;--rose:#FF7FA6;--lav:#BFA6FF;--gold:#FFC94D;--border:#3E2A52;--disc:#33214A;--track:#3E2A52}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);font-family:-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;color:var(--ink);min-height:100vh;padding:16px;transition:background .3s}
.wrap{max-width:420px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:16px 12px 14px;margin-bottom:12px;transition:background .3s}
.card h3{font-size:15px;font-weight:700;margin:0 4px 6px}
#wheelBox{position:relative;width:100%;max-width:320px;margin:0 auto;aspect-ratio:1}
#wheel{width:100%;height:100%;display:block;overflow:visible}
.center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none}
.center .num{font-size:40px;font-weight:800;line-height:1}
.center .lbl{font-size:12px;color:var(--muted);margin-top:3px}
.center .nxt{font-size:13.5px;font-weight:800;color:var(--rose);margin-top:6px}
.legend{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin-top:6px;font-size:11.5px;color:var(--muted)}
.legend span{display:flex;align-items:center;gap:5px}
.legend i{width:10px;height:10px;border-radius:50%;display:block}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--card);font-size:12px;font-weight:700;padding:6px 10px;border-radius:10px;white-space:nowrap;transform:translate(-50%,-130%);opacity:0;transition:opacity .2s}
.tip.on{opacity:1}
.ctl label{display:flex;justify-content:space-between;font-size:13px;font-weight:600;margin:10px 4px 4px}
.ctl input[type=range]{width:100%;accent-color:var(--rose)}
.row{display:flex;gap:8px;margin-top:12px}
button{flex:1;border:0;border-radius:999px;padding:11px;font-weight:800;font-size:13.5px;cursor:pointer;background:var(--rose);color:#fff}
button.alt{background:var(--track);color:var(--ink)}
.note{font-size:11.5px;color:var(--muted);margin:10px 4px 0;line-height:1.45}

/* animasyonlar */
.bloom{transform-origin:0 0;animation:bloom .55s cubic-bezier(.3,1.6,.5,1) both}
@keyframes bloom{from{transform:scale(0) rotate(-60deg)}to{transform:scale(1) rotate(0)}}
.sway{transform-origin:0 0;animation:sway 3.2s ease-in-out infinite alternate}
@keyframes sway{from{transform:rotate(-7deg)}to{transform:rotate(7deg)}}
.leafIn{transform-origin:0 0;animation:leafIn .5s ease-out both}
@keyframes leafIn{from{transform:scale(0)}to{transform:scale(1)}}
.spin{transform-origin:0 0;animation:spin 12s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.pulse{transform-origin:0 0;animation:pulse 1.8s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
.twinkle{transform-origin:0 0;animation:twinkle 2.4s ease-in-out infinite}
@keyframes twinkle{0%,100%{opacity:.15;transform:scale(.4) rotate(0)}50%{opacity:1;transform:scale(1) rotate(45deg)}}
.flapL{transform-origin:0 0;animation:flap .32s ease-in-out infinite alternate}
.flapR{transform-origin:0 0;animation:flap .32s ease-in-out infinite alternate}
@keyframes flap{from{transform:scaleX(1)}to{transform:scaleX(.35)}}
.buzz{transform-origin:0 0;animation:buzz .08s linear infinite alternate}
@keyframes buzz{from{transform:scaleY(1)}to{transform:scaleY(.4)}}
.legs{animation:legs .18s linear infinite alternate}
@keyframes legs{from{transform:translateY(-.8px)}to{transform:translateY(.8px)}}
.vine{stroke-dasharray:var(--len);stroke-dashoffset:var(--len);animation:draw 1.4s ease-out forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.heart{animation:heartUp 1.4s ease-out forwards}
@keyframes heartUp{from{opacity:1;transform:translate(0,0) scale(.6)}to{opacity:0;transform:translate(var(--dx),-46px) scale(1.2)}}
@media (prefers-reduced-motion: reduce){*{animation-duration:.01s!important;animation-iteration-count:1!important}}
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <h3>Bu döngü</h3>
    <div id="wheelBox">
      <svg id="wheel" viewBox="0 0 260 260" aria-label="Döngü çarkı"></svg>
      <div class="center"><div class="num" id="cNum">19.</div><div class="lbl">döngü günü</div><div class="nxt" id="cNext"></div></div>
      <div class="tip" id="tip"></div>
    </div>
    <div class="legend">
      <span><i style="background:var(--rose)"></i>Regl</span>
      <span><i style="background:var(--lav)"></i>Doğurgan pencere</span>
      <span><i style="background:var(--gold)"></i>Yumurtlama</span>
      <span><svg width="12" height="12" viewBox="-6 -6 12 12"><circle r="5" fill="#E8434F"/><circle cx="-1.8" cy="1" r="1.1" fill="#2B1B1F"/><circle cx="1.9" cy="-.6" r="1.1" fill="#2B1B1F"/></svg>Bugün</span>
    </div>
  </div>

  <div class="card ctl">
    <h3>Deneme ayarları</h3>
    <label>Bugün döngünün kaçıncı günü <b id="vDay"></b></label>
    <input type="range" id="sDay" min="1" max="28" value="19">
    <label>Döngü uzunluğu <b id="vLen"></b></label>
    <input type="range" id="sLen" min="21" max="40" value="28">
    <label>Regl süresi <b id="vPer"></b></label>
    <input type="range" id="sPer" min="2" max="8" value="5">
    <div class="row">
      <button id="bReplay">Animasyonu tekrar oynat</button>
      <button class="alt" id="bTheme">Karanlık tema</button>
    </div>
    <p class="note">Çiçeklere dokununca o günün bilgisi çıkar. Uğur böceğine dokununca kalpler uçar. Bu sayfa sadece deneme içindir; beğenirsen aynı çark uygulamadaki eski çarkın yerine konur.</p>
  </div>
</div>

<script>
const NS = 'http://www.w3.org/2000/svg', C = 130, R = 96;
const svg = document.getElementById('wheel');
const st = { day: 19, len: 28, per: 5 };
const css = (v) => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const el = (tag, attrs, parent) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (parent) parent.appendChild(e); return e; };
const pol = (r, deg) => { const a = (deg - 90) * Math.PI / 180; return [C + r * Math.cos(a), C + r * Math.sin(a)]; };
const angOf = (d) => (d + 0.5) / st.len * 360;
const f = (n) => n.toFixed(2);
let timers = [], raf = 0;

// ---------- parçalar ----------
function flower(g, kind, size) {
  // kind: period | fertile | ovulation
  const pal = {
    period: { p: '#F7739A', p2: '#FFB3C8', c: '#FFD86B' },
    fertile: { p: '#B69AF0', p2: '#DCCBFF', c: '#FFD86B' },
    ovulation: { p: '#FFC94D', p2: '#FFE7A3', c: '#E58A2E' },
  }[kind];
  const n = kind === 'ovulation' ? 8 : 5, pr = size * 0.5;
  const petals = el('g', {}, g);
  for (let i = 0; i < n; i++) {
    const a = i * 360 / n;
    el('ellipse', { cx: 0, cy: -pr * 0.62, rx: pr * (n === 8 ? 0.3 : 0.42), ry: pr * 0.6, fill: pal.p, transform: 'rotate(' + a + ')' }, petals);
    el('ellipse', { cx: 0, cy: -pr * 0.68, rx: pr * (n === 8 ? 0.13 : 0.18), ry: pr * 0.3, fill: pal.p2, opacity: .85, transform: 'rotate(' + a + ')' }, petals);
  }
  el('circle', { r: pr * 0.32, fill: pal.c }, g);
  el('circle', { cx: -pr * 0.1, cy: -pr * 0.1, r: pr * 0.1, fill: '#fff', opacity: .7 }, g);
  return petals;
}
function leaf(g, len, color) {
  el('path', { d: 'M0 0 C' + f(len * .35) + ' ' + f(-len * .45) + ' ' + f(len * .85) + ' ' + f(-len * .3) + ' ' + f(len) + ' 0 C' + f(len * .85) + ' ' + f(len * .3) + ' ' + f(len * .35) + ' ' + f(len * .45) + ' 0 0Z', fill: color }, g);
  el('path', { d: 'M1 0 L' + f(len * .8) + ' 0', stroke: 'rgba(255,255,255,.45)', 'stroke-width': .8, 'stroke-linecap': 'round', fill: 'none' }, g);
}
function bud(g) {
  el('circle', { r: 3.4, fill: '#FFFFFF', stroke: '#9CCB8F', 'stroke-width': 1.4 }, g);
  el('circle', { r: 1.3, fill: '#F9D3DE' }, g);
}
function ladybug(g) {
  const legs = el('g', { class: 'legs' }, g);
  [-3, 0, 3].forEach((y) => { el('line', { x1: -4, y1: y, x2: -7.5, y2: y + 1, stroke: '#2B1B1F', 'stroke-width': 1.1, 'stroke-linecap': 'round' }, legs); el('line', { x1: 4, y1: y, x2: 7.5, y2: y + 1, stroke: '#2B1B1F', 'stroke-width': 1.1, 'stroke-linecap': 'round' }, legs); });
  el('circle', { cx: 0, cy: -6.5, r: 3.6, fill: '#2B1B1F' }, g);
  el('circle', { cx: -1.4, cy: -7.6, r: .9, fill: '#fff' }, g); el('circle', { cx: 1.4, cy: -7.6, r: .9, fill: '#fff' }, g);
  el('path', { d: 'M-1.5 -9.5 Q-3 -12.5 -4.5 -12.5 M1.5 -9.5 Q3 -12.5 4.5 -12.5', stroke: '#2B1B1F', 'stroke-width': .9, fill: 'none', 'stroke-linecap': 'round' }, g);
  el('ellipse', { rx: 6.2, ry: 7, fill: '#E8434F', stroke: '#B8283A', 'stroke-width': .8 }, g);
  el('line', { x1: 0, y1: -6.6, x2: 0, y2: 6.8, stroke: '#2B1B1F', 'stroke-width': .9 }, g);
  [[-3, -2.5, 1.5], [3, -2.5, 1.5], [-3.2, 2.6, 1.3], [3.2, 2.6, 1.3], [0, 5, .0]].forEach(([x, y, r]) => r && el('circle', { cx: x, cy: y, r, fill: '#2B1B1F' }, g));
  el('ellipse', { cx: -2.4, cy: -3.6, rx: 1.4, ry: .8, fill: '#fff', opacity: .55, transform: 'rotate(-30 -2.4 -3.6)' }, g);
}
function butterfly(g, c1, c2) {
  const L = el('g', { class: 'flapL' }, g), Rw = el('g', { class: 'flapR' }, g);
  [[L, -1], [Rw, 1]].forEach(([w, s]) => {
    el('path', { d: 'M0 -1 C' + 9 * s + ' -12 ' + 15 * s + ' -4 ' + 8 * s + ' 1 Z', fill: c1 }, w);
    el('path', { d: 'M0 0 C' + 8 * s + ' 2 ' + 10 * s + ' 9 ' + 3 * s + ' 8 Z', fill: c2 }, w);
    el('circle', { cx: 7 * s, cy: -4, r: 1.6, fill: '#fff', opacity: .7 }, w);
  });
  el('ellipse', { rx: 1.4, ry: 5.5, fill: '#5A3341' }, g);
  el('path', { d: 'M-.6 -5 Q-2.5 -9 -4 -9.5 M.6 -5 Q2.5 -9 4 -9.5', stroke: '#5A3341', 'stroke-width': .8, fill: 'none', 'stroke-linecap': 'round' }, g);
}
function bee(g) {
  const w = el('g', { class: 'buzz' }, g);
  el('ellipse', { cx: -2.5, cy: -4.5, rx: 2.8, ry: 4, fill: '#DDF2FF', opacity: .9, transform: 'rotate(-25 -2.5 -4.5)' }, w);
  el('ellipse', { cx: 2.5, cy: -4.5, rx: 2.8, ry: 4, fill: '#DDF2FF', opacity: .9, transform: 'rotate(25 2.5 -4.5)' }, w);
  el('ellipse', { rx: 5.6, ry: 4, fill: '#FFC94D' }, g);
  el('rect', { x: -1.8, y: -3.9, width: 1.6, height: 7.8, fill: '#3B2A33' }, g);
  el('rect', { x: 1.6, y: -3.6, width: 1.4, height: 7.2, fill: '#3B2A33' }, g);
  el('circle', { cx: -5.4, cy: 0, r: 2.6, fill: '#3B2A33' }, g);
  el('circle', { cx: -6, cy: -.6, r: .7, fill: '#fff' }, g);
  el('path', { d: 'M5.6 0 L7.6 0', stroke: '#3B2A33', 'stroke-width': 1.2, 'stroke-linecap': 'round' }, g);
}
function sparkle(g, s, color) {
  el('path', { d: 'M0 ' + -s + ' Q0 0 ' + s + ' 0 Q0 0 0 ' + s + ' Q0 0 ' + -s + ' 0 Q0 0 0 ' + -s + 'Z', fill: color }, g);
}
function heartPath(s) { return 'M0 ' + f(s * .9) + ' C' + f(-s * 1.6) + ' 0 ' + f(-s * 1.1) + ' ' + f(-s * 1.4) + ' 0 ' + f(-s * .5) + ' C' + f(s * 1.1) + ' ' + f(-s * 1.4) + ' ' + f(s * 1.6) + ' 0 0 ' + f(s * .9) + 'Z'; }

// ---------- çizim ----------
function info() {
  const N = st.len, ov = Math.max(0, N - 15), fs = Math.max(0, ov - 5), fe = Math.min(N - 1, ov + 1);
  const typeOf = (d) => d < st.per ? 'period' : d === ov ? 'ovulation' : d >= fs && d <= fe ? 'fertile' : 'none';
  return { N, ov, fs, fe, typeOf };
}
function build() {
  timers.forEach(clearTimeout); timers = []; cancelAnimationFrame(raf);
  svg.innerHTML = '';
  const I = info(), dark = document.documentElement.dataset.theme === 'dark';
  const defs = el('defs', {}, svg);
  const lg = el('linearGradient', { id: 'prog', x1: 0, y1: 0, x2: 1, y2: 1 }, defs);
  el('stop', { offset: 0, 'stop-color': '#FF8FB1' }, lg); el('stop', { offset: 1, 'stop-color': '#B69AF0' }, lg);
  const rg = el('radialGradient', { id: 'disc' }, defs);
  el('stop', { offset: .55, 'stop-color': css('--disc') }, rg); el('stop', { offset: 1, 'stop-color': css('--disc'), 'stop-opacity': 0 }, rg);

  // iç disk ve ilerleme halkası
  el('circle', { cx: C, cy: C, r: 84, fill: 'url(#disc)' }, svg);
  el('circle', { cx: C, cy: C, r: 72, fill: 'none', stroke: css('--track'), 'stroke-width': 6 }, svg);
  const circ = 2 * Math.PI * 72, frac = (st.day - .5) / I.N;
  const prog = el('circle', { cx: C, cy: C, r: 72, fill: 'none', stroke: 'url(#prog)', 'stroke-width': 6, 'stroke-linecap': 'round', 'stroke-dasharray': circ, 'stroke-dashoffset': circ, transform: 'rotate(-90 ' + C + ' ' + C + ')' }, svg);
  prog.style.transition = 'stroke-dashoffset 2s cubic-bezier(.4,0,.2,1)';
  requestAnimationFrame(() => requestAnimationFrame(() => prog.setAttribute('stroke-dashoffset', circ * (1 - frac))));

  // dalgalı sarmaşık
  let d = '';
  for (let i = 0; i <= 720; i++) { const a = i / 2, r = R + 3.2 * Math.sin(a * Math.PI / 180 * I.N); const [x, y] = pol(r, a); d += (i ? 'L' : 'M') + f(x) + ' ' + f(y); }
  const vine = el('path', { d, fill: 'none', stroke: dark ? '#6FAF74' : '#8CC88A', 'stroke-width': 2.6, 'stroke-linecap': 'round', class: 'vine' }, svg);
  vine.style.setProperty('--len', vine.getTotalLength());

  // yapraklar ve küçük kıvrımlar (gün aralarında)
  const leaves = el('g', {}, svg);
  for (let i = 0; i < I.N; i++) {
    const a = i / I.N * 360, out = i % 2 === 0, [x, y] = pol(R + (out ? 2 : -2), a);
    const g = el('g', { transform: 'translate(' + f(x) + ' ' + f(y) + ') rotate(' + f(a + (out ? -90 + 35 : 90 - 35) - 90 + 90) + ')' }, leaves);
    const inner = el('g', { class: 'leafIn' }, g); inner.style.animationDelay = (0.3 + i * 0.035) + 's';
    const sw = el('g', { class: 'sway' }, inner); sw.style.animationDelay = (-i * 0.4) + 's';
    leaf(sw, 11 + (i % 3), i % 3 === 0 ? '#6DBB74' : i % 3 === 1 ? '#8FD08A' : '#5AA866');
    if (i % 4 === 2) { // kıvrık filiz
      const [tx, ty] = pol(R + (out ? -9 : 9), a + 3);
      el('path', { d: 'M' + f(x) + ' ' + f(y) + ' Q' + f((x + tx) / 2 + 3) + ' ' + f((y + ty) / 2 - 3) + ' ' + f(tx) + ' ' + f(ty), fill: 'none', stroke: '#9CCB8F', 'stroke-width': 1.2, 'stroke-linecap': 'round' }, leaves);
    }
  }

  // günler: çiçekler ve tomurcuklar
  const days = el('g', {}, svg);
  for (let i = 0; i < I.N; i++) {
    const t = I.typeOf(i), [x, y] = pol(R, angOf(i));
    const g = el('g', { transform: 'translate(' + f(x) + ' ' + f(y) + ')', style: 'cursor:pointer' }, days);
    const b = el('g', { class: 'bloom' }, g); b.style.animationDelay = (0.7 + i * 0.06) + 's';
    if (t === 'none') bud(b);
    else {
      const holder = el('g', { class: t === 'ovulation' ? 'spin' : 'sway' }, b);
      if (t !== 'ovulation') holder.style.animationDelay = (-i * 0.3) + 's';
      flower(holder, t, t === 'ovulation' ? 22 : 16);
      if (t === 'ovulation') { const p = el('g', { class: 'pulse' }, b); el('circle', { r: 13, fill: 'none', stroke: '#FFC94D', 'stroke-width': 1, opacity: .6 }, p); b.insertBefore(p, b.firstChild); }
    }
    el('circle', { r: 11, fill: 'transparent' }, g);
    g.addEventListener('click', (e) => { e.stopPropagation(); showTip(i, t, x, y); });
  }

  // parıltılar
  const sp = el('g', {}, svg);
  [[30, 128], [60, 18], [100, 236], [150, 20], [205, 225], [250, 120], [118, 132], [230, 40], [20, 200]].forEach(([a, r], k) => {
    const [x, y] = k === 6 ? [C - 44, C - 40] : pol(r < 130 ? R + 24 : R + 22, a + k * 9);
    const g = el('g', { transform: 'translate(' + f(x) + ' ' + f(y) + ')' }, sp);
    const tw = el('g', { class: 'twinkle' }, g); tw.style.animationDelay = (k * 0.37) + 's';
    sparkle(tw, k % 2 ? 3.2 : 4.5, k % 3 === 0 ? '#FFC94D' : k % 3 === 1 ? '#FF9DBB' : '#C9B3FF');
  });
  // küçük kalpler
  [[200, R + 20], [340, R + 18], [95, R + 22]].forEach(([a, r], k) => {
    const [x, y] = pol(r, a); const g = el('g', { transform: 'translate(' + f(x) + ' ' + f(y) + ')' }, sp);
    const p = el('g', { class: 'pulse' }, g); p.style.animationDelay = (k * .6) + 's';
    el('path', { d: heartPath(4), fill: '#FF9DBB', opacity: .8 }, p);
  });

  // arı (yumurtlama çiçeğinin etrafında)
  const [ox, oy] = pol(R, angOf(I.ov));
  const beeG = el('g', {}, svg); bee(beeG);
  // kelebekler
  const bf1 = el('g', {}, svg); butterfly(bf1, '#FF8FB1', '#FFC2D4');
  const bf2 = el('g', {}, svg); butterfly(bf2, '#B69AF0', '#DCCBFF');
  // uğur böceği: 1. günden bugüne yürür
  const lbG = el('g', { style: 'cursor:pointer' }, svg); const lbInner = el('g', {}, lbG); ladybug(lbInner);
  lbG.addEventListener('click', (e) => { e.stopPropagation(); hearts(lbX, lbY); });
  let lbX = 0, lbY = 0;

  const t0 = performance.now(), target = st.day - 1, walkStart = 1.2, walkDur = 1.2 + target * 0.07;
  const ease = (x) => x < .5 ? 2 * x * x : 1 - Math.pow(-2 * x + 2, 2) / 2;
  const legs = lbInner.querySelector('.legs');
  function frame(now) {
    const t = (now - t0) / 1000;
    // uğur böceği
    const k = Math.min(1, Math.max(0, (t - walkStart) / walkDur)), pos = ease(k) * target;
    const a = angOf(pos), [x, y] = pol(R - 0.5, a); lbX = x; lbY = y;
    const walking = k > 0 && k < 1;
    legs.style.animationPlayState = walking ? 'running' : 'paused';
    const bob = walking ? 0 : Math.sin(t * 2) * .6;
    lbG.setAttribute('transform', 'translate(' + f(x) + ' ' + f(y + bob) + ') rotate(' + f(a + 90) + ') scale(' + (k === 0 ? Math.min(1, t / walkStart) : 1.15) + ')');
    // arı: yumurtlama çiçeğinin çevresinde sekiz çizer
    const ba = t * 2.2, bx = ox + Math.sin(ba) * 20, by = oy + Math.sin(ba * 2) * 9 - 4;
    beeG.setAttribute('transform', 'translate(' + f(bx) + ' ' + f(by) + ') scale(' + (Math.cos(ba) > 0 ? -1 : 1) + ' 1)');
    // kelebekler çarkın dışında süzülür
    [[bf1, 0.16, 0, 22], [bf2, -0.12, 180, 28]].forEach(([g, sp, off, rr]) => {
      const ang = off + t * sp * 60, r = R + rr + Math.sin(t * 1.3 + off) * 6;
      const [x, y] = pol(r, ang); g.setAttribute('transform', 'translate(' + f(x) + ' ' + f(y + Math.sin(t * 3 + off) * 3) + ') rotate(' + f(Math.sin(t * 1.7 + off) * 18) + ') scale(1.5)');
    });
    raf = requestAnimationFrame(frame);
  }
  raf = requestAnimationFrame(frame);

  // ortadaki yazılar (sayaç animasyonu)
  const num = document.getElementById('cNum'), nxt = document.getElementById('cNext');
  const left = I.N - (st.day - 1);
  nxt.textContent = st.day <= st.per ? 'Regl ' + st.day + '. gün' : st.day - 1 === I.ov ? 'Bugün yumurtlama günü' : 'Regle ' + left + ' gün';
  const c0 = performance.now();
  (function count(now) { const k = Math.min(1, (now - c0) / 1600); num.textContent = Math.max(1, Math.round(ease(k) * st.day)) + '.'; if (k < 1) requestAnimationFrame(count); })(c0);
}

function showTip(i, t, x, y) {
  const tip = document.getElementById('tip'), box = document.getElementById('wheelBox').getBoundingClientRect();
  const names = { period: 'Regl ' + (i + 1) + '. gün', fertile: 'Doğurgan gün', ovulation: 'Yumurtlama günü', none: 'Normal gün' };
  tip.textContent = (i + 1) + '. gün · ' + names[t];
  tip.style.left = (x / 260 * box.width) + 'px'; tip.style.top = (y / 260 * box.height) + 'px';
  tip.classList.add('on'); clearTimeout(tip._t); tip._t = setTimeout(() => tip.classList.remove('on'), 1800);
}
function hearts(x, y) {
  for (let i = 0; i < 6; i++) {
    const g = el('g', { transform: 'translate(' + f(x) + ' ' + f(y) + ')' }, svg);
    const h = el('path', { d: heartPath(3 + Math.random() * 2), fill: ['#FF8FB1', '#F0648C', '#C9B3FF'][i % 3], class: 'heart' }, g);
    h.style.setProperty('--dx', (Math.random() * 40 - 20) + 'px'); h.style.animationDelay = (i * 0.08) + 's'; h.style.opacity = 0;
    setTimeout(() => g.remove(), 1800);
  }
}

// ---------- ayarlar ----------
const sDay = document.getElementById('sDay'), sLen = document.getElementById('sLen'), sPer = document.getElementById('sPer');
function sync(rebuild) {
  st.len = +sLen.value; sDay.max = st.len; st.day = Math.min(+sDay.value, st.len); st.per = +sPer.value;
  document.getElementById('vDay').textContent = st.day + '. gün';
  document.getElementById('vLen').textContent = st.len + ' gün';
  document.getElementById('vPer').textContent = st.per + ' gün';
  if (rebuild) build();
}
let deb; [sDay, sLen, sPer].forEach((s) => s.addEventListener('input', () => { sync(false); clearTimeout(deb); deb = setTimeout(() => build(), 250); }));
document.getElementById('bReplay').onclick = build;
document.getElementById('bTheme').onclick = (e) => {
  const d = document.documentElement, dark = d.dataset.theme !== 'dark';
  d.dataset.theme = dark ? 'dark' : 'light'; e.target.textContent = dark ? 'Açık tema' : 'Karanlık tema'; build();
};
document.addEventListener('click', () => document.getElementById('tip').classList.remove('on'));
sync(true);
</script>
